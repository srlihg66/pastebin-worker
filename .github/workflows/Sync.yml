name: Upstream Sync

on:
  schedule:
    - cron: "0 0 * * 1"  # 每周一 00:00 自动同步
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # 必须完整历史才能合并
          ref: goshujin         # 签出你自己的分支

      - name: Set up upstream remote and fetch
        run: |
          git remote add upstream https://github.com/SharzyL/pastebin-worker.git
          git fetch upstream goshujin

      - name: Enable sparse-checkout (exclude workflows)
        run: |
          git sparse-checkout init --cone
          git sparse-checkout set --no-cone ':(exclude).github/workflows' ':/*'

      - name: Merge upstream changes (excluding workflows)
        run: |
          git merge upstream/goshujin --no-edit || true

      - name: Push changes back to your fork
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin goshujin
